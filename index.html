<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Sea Battle</title>
    <link href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" rel="stylesheet" />
    <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status {
            width: 95%;
            max-width: 1400px;
            padding: 15px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
            background: #95a5a6;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .game-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            width: 100%;
            max-width: 1500px;
        }

        .board-wrapper {
            width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-caption {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #34495e;
        }

        .pivot-host {
            width: 100%;
            height: 720px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div id="status">Підключення...</div>

    <div class="game-container">

        <div class="board-wrapper">
            <div class="board-caption">Ваше поле</div>
            <div id="pivotMy" class="pivot-host"></div>
        </div>

        <div class="board-wrapper">
            <div class="board-caption">Поле опонента</div>
            <div id="pivotEnemy" class="pivot-host"></div>
        </div>


    </div>
    <script>
        const socket = io('http://localhost:3000');

        socket.on('connect', () => {
            socket.emit('joinGame');
        });

        let pivotEnemy, pivotMy;

        function getReportConfig(data) {
            return {
                dataSource: {
                    data: data,
                    mapping: {
                        "X": { type: "string" },
                        "Y": { type: "string" },
                        "Status": { type: "number" }
                    }
                },
                slice: {
                    rows: [{ uniqueName: "Y" }],
                    columns: [{ uniqueName: "X" }],
                    measures: [{ uniqueName: "Status", aggregation: "sum" }]
                },
                options: {
                    grid: {
                        type: "compact",
                        showTotals: "off",
                        showGrandTotals: "off",
                        showHeaders: true,
                        showHierarchyCaptions: false,
                    }
                },
                tableSizes: {
                    columns: [
                        { width: 40, idx: 0 }, { width: 40, idx: 1 }, { width: 40, idx: 2 },
                        { width: 40, idx: 3 }, { width: 40, idx: 4 }, { width: 40, idx: 5 },
                        { width: 40, idx: 6 }, { width: 40, idx: 7 }, { width: 40, idx: 8 },
                        { width: 40, idx: 9 }, { width: 40, idx: 10 }
                    ]
                },
                conditions: [
                    {
                        formula: "#value = 0",
                        format: { backgroundColor: "#65a5d3", color: "#65a5d3" }
                    },
                    {
                        formula: "#value = 1",
                        format: { backgroundColor: "#27AE60", color: "#27AE60" }
                    },
                    {
                        formula: "#value = 2",
                        format: { backgroundColor: "#ecf0f1", color: "#ecf0f1" }
                    },
                    {
                        formula: "#value = 3",
                        format: { backgroundColor: "#e74c3c", color: "#e74c3c" }
                    }
                ]
            };
        }

        pivotEnemy = new WebDataRocks({
            container: "#pivotEnemy",
            report: getReportConfig([], true),
            cellclick: function (cell) {
                const statusEl = document.getElementById('status');
                if (cell.type === "value" && statusEl.dataset.isTurn === "true" && !statusEl.dataset.win) {
                    const x = cell.columns[0].caption;
                    const y = cell.rows[0].caption;
                    socket.emit('shot', { x, y });
                }
            }
        });

        pivotMy = new WebDataRocks({
            container: "#pivotMy",
            report: getReportConfig([], false)
        });

        socket.on('update', (data) => {
            const statusEl = document.getElementById('status');
            statusEl.dataset.isTurn = data.isMyTurn;
            statusEl.dataset.win = data.winner ? "true" : "";

            if (data.winner) {
                statusEl.innerText = data.winner;
                statusEl.style.background = data.winner.includes("WIN") ? "#f1c40f" : "#34495e";
            } else if (!data.ready) {
                statusEl.innerText = "Очікування суперника...";
                statusEl.style.background = "#95a5a6";
            } else {
                statusEl.innerText = data.isMyTurn ? "Ваш хід" : "Хід опонента (очікуйте)";
                statusEl.style.background = data.isMyTurn ? "#2ecc71" : "#e74c3c";
            }

            const formattedEnemy = data.opponentBoard.map(c => ({ X: String(c.X), Y: String(c.Y), Status: c.Status }));
            pivotEnemy.setReport(getReportConfig(formattedEnemy, true));

            const formattedMy = data.myBoard.map(c => ({ X: String(c.X), Y: String(c.Y), Status: c.Status }));
            pivotMy.setReport(getReportConfig(formattedMy, false));

        });
    </script>
</body>

</html>
